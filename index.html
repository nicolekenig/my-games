<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
    <header>
        <div class="logo-row">
            <div class="logo-icon">🎮</div>
            <h1>My Games</h1>
        </div>
        <p class="subtitle">Pick a game · play · beat your score</p>
    </header>

    <section class="player-section">
        <p class="section-label">Player</p>
        <input id="player-input" type="text" placeholder="Enter your name…" maxlength="24" autocomplete="off">
        <p class="greeting" id="greeting"></p>
    </section>

    <section class="games-section">
        <a href="forbidden-word/index.html" class="game-card" id="game-link">
            <div>
                <div class="game-name">Forbidden Word</div>
                <div class="game-desc">Multiplayer party word game</div>
            </div>
            <button class="play-btn" tabindex="-1">&#9654; Play</button>
        </a>
    </section>

    <footer>MY-GAMES · DARK ARCADE</footer>
</div>

<script>
    const input = document.getElementById('player-input');
    const greeting = document.getElementById('greeting');
    const gameLink = document.getElementById('game-link');

    // Load saved name
    const saved = localStorage.getItem('playerName');
    if (saved) {
        input.value = saved;
        showGreeting(saved);
    }

    // Save name on input
    input.addEventListener('input', () => {
        const name = input.value.trim();
        localStorage.setItem('playerName', name);
        showGreeting(name);
    });

    function showGreeting(name) {
        if (name) {
            greeting.textContent = '👾 Hey, ' + name + '! Choose a game below.';
            greeting.classList.add('visible');
        } else {
            greeting.classList.remove('visible');
        }
    }

    // Add player name to game link
    gameLink.addEventListener('click', function(e) {
        e.preventDefault();
        const name = input.value.trim() || 'Player';
        window.location.href = 'forbidden-word/index.html?player=' + encodeURIComponent(name);
    });
</script>
</body>
</html>
