<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

    <!-- Header -->
    <header>
        <div class="logo-row">
            <div class="logo-icon">🎮</div>
            <h1>My Games</h1>
        </div>
        <p class="subtitle">Pick a game · play · beat your score</p>
    </header>

    <!-- Player name -->
    <section class="player-section">
        <p class="section-label">Player</p>
        <input
                id="player-input"
                type="text"
                placeholder="Enter your name…"
                maxlength="24"
                autocomplete="off"
                spellcheck="false"
        >
        <p class="greeting" id="greeting"></p>
    </section>

    <!-- Games -->
    <section class="games-section" id="games-list"></section>

    <footer>MY-GAMES · DARK ARCADE</footer>

</div>
<script>
    /* ─────────────────────────────────────────────
       GAMES REGISTRY
       Add an entry here whenever you add a new game folder.
    ───────────────────────────────────────────── */
    const GAMES = [
        {
            name: 'Forbidden Word',
            desc: 'Multiplayer party word game',
            path: 'forbidden-word/index.html',
            requiresServer: true  // This game needs Node.js server
        },
        {
            name: 'Emoji Charades',
            desc: 'Describe words using only emojis',
            path: 'emoji-charades/index.html',
            requiresServer: true  // This game needs Node.js server
        },
        // Add more games here as you create them
    ];

    /* ── Player name ── */
    const input    = document.getElementById('player-input');
    const greeting = document.getElementById('greeting');

    const saved = localStorage.getItem('playerName');
    if (saved) { input.value = saved; showGreeting(saved); }

    input.addEventListener('input', () => {
        const name = input.value.trim();
        localStorage.setItem('playerName', name);
        showGreeting(name);
    });

    function showGreeting(name) {
        if (name) {
            greeting.textContent = '👾 Hey, ' + name + '! Choose a game below.';
            greeting.classList.add('visible');
        } else {
            greeting.classList.remove('visible');
        }
    }

    /* ── Build game cards ── */
    const list = document.getElementById('games-list');

    if (!GAMES.length) {
        list.innerHTML = '<div class="empty">No games yet.<br>Add a folder under <code>my-games/</code> and register it in the GAMES array.</div>';
    } else {
        GAMES.forEach(game => {
            const card = document.createElement('a');
            card.className = 'game-card';
            card.href      = game.path;
            card.innerHTML =
                '<div>' +
                '<div class="game-name">' + game.name + '</div>' +
                '<div class="game-desc">' + game.desc + '</div>' +
                '</div>' +
                '<button class="play-btn" tabindex="-1">&#9654; Play</button>';

            /* Forward the player name as ?player=Alice */
            card.addEventListener('click', function(e) {
                e.preventDefault();

                // Check if this game requires a server
                if (game.requiresServer) {
                    // Check if server is running
                    fetch('/socket.io/')
                        .then(() => {
                            // Server is running, proceed to game
                            const name = input.value.trim() || 'Player';
                            window.location.href = game.path + '?player=' + encodeURIComponent(name);
                        })
                        .catch(() => {
                            // Server not running
                            alert('⚠️ This game requires a server!\n\n' +
                                'To play ' + game.name + ':\n' +
                                '1. Open terminal in the my-games folder\n' +
                                '2. Run: npm install\n' +
                                '3. Run: npm start\n' +
                                '4. Open http://localhost:3000\n\n' +
                                'This game won\'t work on GitHub Pages - it needs real-time multiplayer!');
                        });
                } else {
                    // Regular game, just navigate
                    const name = input.value.trim() || 'Player';
                    window.location.href = game.path + '?player=' + encodeURIComponent(name);
                }
            });

            list.appendChild(card);
        });
    }
</script>
</body>
</html>
