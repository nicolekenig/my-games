<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games</title>
    <link rel="stylesheet" href="shared/style.css">
    <style>
        /* ── Home-screen-only styles ───────────────────────────────────── */

        .page {
            min-height: 100vh;
            max-width: 640px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
            display: flex;
            flex-direction: column;
            gap: 2.8rem;
        }

        /* Header */
        header { display: flex; flex-direction: column; gap: .4rem; }

        .logo-row {
            display: flex;
            align-items: center;
            gap: .75rem;
        }

        .logo-icon {
            width: 36px; height: 36px;
            background: var(--accent);
            border-radius: 8px;
            display: grid; place-items: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 0 18px rgba(124,111,247,.25);
        }

        .subtitle {
            font-size: .72rem;
            color: var(--muted);
            letter-spacing: .08em;
            text-transform: uppercase;
            padding-left: 48px;
        }

        /* Player section */
        .section-label {
            font-size: .68rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: .5rem;
        }

        .player-section { display: flex; flex-direction: column; }

        #player-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: .75rem 1rem;
            color: var(--text);
            font-family: system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        #player-input::placeholder { color: var(--muted); font-weight: 400; }

        #player-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124,111,247,.15);
        }

        .greeting {
            font-size: .8rem;
            color: var(--accent);
            margin-top: .55rem;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity .3s;
        }
        .greeting.visible { opacity: 1; }

        /* Games list */
        .games-section { display: flex; flex-direction: column; gap: .75rem; }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.1rem 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            text-decoration: none;
            color: var(--text);
            transition: border-color .2s, box-shadow .2s, transform .15s;
        }

        .game-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 22px rgba(124,111,247,.18);
            transform: translateY(-2px);
        }

        .game-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .game-desc {
            font-size: .72rem;
            color: var(--muted);
            margin-top: .2rem;
        }

        .play-btn {
            flex-shrink: 0;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: .5rem 1.1rem;
            font-family: system-ui, sans-serif;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s, box-shadow .2s;
        }

        .play-btn:hover {
            background: #9389f9;
            box-shadow: 0 0 14px rgba(124,111,247,.3);
        }

        .empty {
            text-align: center;
            padding: 3rem 1rem;
            border: 1px dashed var(--border);
            border-radius: 14px;
            color: var(--muted);
            font-size: .8rem;
            line-height: 1.9;
        }

        footer {
            margin-top: auto;
            text-align: center;
            font-size: .65rem;
            color: #333;
            letter-spacing: .06em;
        }

        @media (max-width: 420px) {
            .page { padding: 2rem 1rem 4rem; }
            .game-name { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="page">

    <!-- Header -->
    <header>
        <div class="logo-row">
            <div class="logo-icon">🎮</div>
            <h1>My Games</h1>
        </div>
        <p class="subtitle">Pick a game · play · beat your score</p>
    </header>

    <!-- Player name -->
    <section class="player-section">
        <p class="section-label">Player</p>
        <input
                id="player-input"
                type="text"
                placeholder="Enter your name…"
                maxlength="24"
                autocomplete="off"
                spellcheck="false"
        >
        <p class="greeting" id="greeting"></p>
    </section>

    <!-- Games -->
    <section class="games-section" id="games-list"></section>

    <footer>MY-GAMES · DARK ARCADE</footer>

</div>
<script>
    /* ─────────────────────────────────────────────
       GAMES REGISTRY
       Add an entry here whenever you add a new game folder.
    ───────────────────────────────────────────── */
    const GAMES = [
        { name: 'Snake',  desc: 'Classic grid crawler',  path: 'snake/index.html'  },
        { name: 'Tetris', desc: 'Stack and clear lines',  path: 'tetris/index.html' },
        // { name: 'Pong', desc: 'Two-player paddle duel', path: 'pong/index.html' },
    ];

    /* ── Player name ── */
    const input    = document.getElementById('player-input');
    const greeting = document.getElementById('greeting');

    const saved = localStorage.getItem('playerName');
    if (saved) { input.value = saved; showGreeting(saved); }

    input.addEventListener('input', () => {
        const name = input.value.trim();
        localStorage.setItem('playerName', name);
        showGreeting(name);
    });

    function showGreeting(name) {
        if (name) {
            greeting.textContent = '👾 Hey, ' + name + '! Choose a game below.';
            greeting.classList.add('visible');
        } else {
            greeting.classList.remove('visible');
        }
    }

    /* ── Build game cards ── */
    const list = document.getElementById('games-list');

    if (!GAMES.length) {
        list.innerHTML = '<div class="empty">No games yet.<br>Add a folder under <code>my-games/</code> and register it in the GAMES array.</div>';
    } else {
        GAMES.forEach(game => {
            const card = document.createElement('a');
            card.className = 'game-card';
            card.href      = game.path;
            card.innerHTML =
                '<div>' +
                '<div class="game-name">' + game.name + '</div>' +
                '<div class="game-desc">' + game.desc + '</div>' +
                '</div>' +
                '<button class="play-btn" tabindex="-1">&#9654; Play</button>';

            /* Forward the player name as ?player=Alice */
            card.addEventListener('click', function(e) {
                const name = input.value.trim();
                if (name) {
                    e.preventDefault();
                    window.location.href = game.path + '?player=' + encodeURIComponent(name);
                }
            });

            list.appendChild(card);
        });
    }
</script>
</body>
</html>
